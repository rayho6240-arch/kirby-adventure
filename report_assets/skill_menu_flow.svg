<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <rect width="1280" height="420" fill="#f7f7f3"/>
  <style>
    .panel { fill: #262626; stroke: #ffffff; stroke-width: 3; rx: 8; }
    .slot { fill: #fafafa; stroke: #333; stroke-width: 2; rx: 6; }
    .locked { fill: #555; opacity: .75; }
    .sel { fill: none; stroke: #f4c542; stroke-width: 6; rx: 8; }
    .txt { font-family: Arial, "Noto Sans TC", sans-serif; font-size: 24px; fill: #222; text-anchor: middle; }
    .light { fill: #fff; }
    .sub { font-size: 18px; fill: #555; }
    .arrow { stroke: #333; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="640" y="50" class="txt" style="font-size:30px;font-weight:700">Skill Menu Control Flow</text>
  <text x="155" y="112" class="txt">Q</text>
  <text x="155" y="140" class="txt sub">pause and open menu</text>
  <path class="arrow" d="M255 130 L350 130"/>
  <g transform="translate(370 80)">
    <rect class="panel" width="540" height="210"/>
    <g transform="translate(40 45)">
      <rect class="slot" width="95" height="120"/>
      <text x="47" y="72" class="txt">N</text>
      <rect class="sel" x="-6" y="-6" width="107" height="132"/>
      <text x="47" y="150" class="txt light" style="font-size:16px">Normal</text>
    </g>
    <g transform="translate(160 45)">
      <rect class="slot" width="95" height="120"/>
      <text x="47" y="72" class="txt">B</text>
      <rect class="locked" width="95" height="120"/>
      <text x="47" y="150" class="txt light" style="font-size:16px">Beam</text>
    </g>
    <g transform="translate(280 45)">
      <rect class="slot" width="95" height="120"/>
      <text x="47" y="72" class="txt">F</text>
      <text x="47" y="150" class="txt light" style="font-size:16px">Fire</text>
    </g>
    <g transform="translate(400 45)">
      <rect class="slot" width="95" height="120"/>
      <text x="47" y="72" class="txt">S</text>
      <text x="47" y="150" class="txt light" style="font-size:16px">Spark</text>
    </g>
  </g>
  <path class="arrow" d="M920 130 L1025 130"/>
  <text x="1100" y="112" class="txt">Enter</text>
  <text x="1100" y="140" class="txt sub">transform and resume</text>
  <text x="640" y="340" class="txt sub">Left / Right changes selection. Locked skills are dark and cannot be selected.</text>
  <text x="640" y="372" class="txt sub">V discards the current ability and returns Kirby to Normal form.</text>
</svg>
